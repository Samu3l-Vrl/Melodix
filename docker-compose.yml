# docker-compose.yml — environnement de développement Laravel Sail.
# Cinq services : l'application (PHP 8.3 + Node), Reverb (WebSocket), le planificateur,
# PostgreSQL 16 et Redis. Démarrage : ./vendor/bin/sail up -d

# Bloc de construction partagé : les trois services PHP utilisent la même image.
# Le déclarer partout évite que Docker tente de TÉLÉCHARGER "sail-8.3/app" (qui n'existe
# que localement) si Reverb démarre avant que l'application ait été construite.
x-sail-build: &sail-build
    context: './vendor/laravel/sail/runtimes/8.3'
    dockerfile: Dockerfile
    args:
        WWWGROUP: '${WWWGROUP:-1000}'

services:
    # --- Application : serveur PHP (port 80) + serveur Vite (port 5173) --------
    laravel.test:
        build: *sail-build
        image: 'sail-8.3/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - reverb

    # --- Reverb : serveur WebSocket, exposé au navigateur sur le port 8080 -----
    # Même image que l'application ; quand une commande est fournie, le conteneur Sail
    # l'exécute à la place de son serveur web.
    reverb:
        build: *sail-build
        image: 'sail-8.3/app'
        command: 'php artisan reverb:start --host=0.0.0.0 --port=8080'
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
        restart: unless-stopped

    # --- Planificateur : exécute rooms:close-inactive toutes les heures --------
    scheduler:
        build: *sail-build
        image: 'sail-8.3/app'
        command: 'php artisan schedule:work'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
        restart: unless-stopped

    # --- PostgreSQL 16 ---------------------------------------------------------
    pgsql:
        image: 'postgres:16-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            # Crée la base "testing" (utilisée par Pest) au premier démarrage du volume.
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    # --- Redis : cache des recherches, sessions, verrous, compteur de quota ----
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
